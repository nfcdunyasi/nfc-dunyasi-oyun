# Statik site kökten yayınlanır; yönetici paneli arka ucu netlify/functions içindedir (ücretsiz plan).
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/yonetim/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# Düğün Planla: davet ve salon sayfaları kişisel ad içerir, arama motorlarına kapalı
[[headers]]
  for = "/d/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/salon/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dugun/yonetim/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/dugun/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Randevu Vaktim: usta paneli, giriş ve yönetim arama motorlarına kapalı
[[headers]]
  for = "/randevu/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/randevu/yonetim/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/randevu/giris"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
